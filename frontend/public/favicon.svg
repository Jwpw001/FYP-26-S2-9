<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Rounded dark background -->
  <rect width="32" height="32" rx="7" fill="#0F1E38"/>

  <!-- Left vertical stem (dark navy) -->
  <rect x="7" y="5" width="5" height="22" rx="2.5" fill="#1D3A6E"/>

  <!-- Upper arm (teal) -->
  <line x1="12" y1="15.5" x2="24" y2="7" stroke="#00D4B0" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Lower arm (dark navy) -->
  <line x1="12" y1="16.5" x2="24" y2="25" stroke="#1D3A6E" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Teal dot at tip of upper arm -->
  <circle cx="24.5" cy="6.5" r="2.8" fill="#00D4B0"/>
</svg>
